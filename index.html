<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eceef0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet" />
    <title>Exam Prep</title>
    <script>
      // Applied before first paint so a dark-mode device never flashes light.
      (function () {
        try {
          var raw = localStorage.getItem('quiz:v1:settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');
        } catch (e) {
          /* storage unavailable — fall through to light */
        }
      })();
    </script>
  </head>
  <body class="h-full wb">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Quiz — Exam Prep</title>
    <script>
      // Applied before first paint so a dark-mode device never flashes light.
      (function () {
        try {
          var raw = localStorage.getItem('quiz:v1:settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage unavailable — fall through to light */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
